[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试允许局部导入、断言惯例
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["config.py", "connector.py", "webserver.py", "stats.py", "log.py",
         "autostart.py", "notify.py", "version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
